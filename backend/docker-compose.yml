version: "3.8"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Make sure the backend knows where the service account JSON is inside the container
      GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: /app/keys/clientsynth-8f10da4eba6e.json
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      # Mount the credentials file from backend folder into the container (read-only)
      - ./clientsynth-8f10da4eba6e.json:/app/keys/clientsynth-8f10da4eba6e.json:ro
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: clientsynth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminpass}
      # Local development: disable CSRF checks to avoid 400s in some browsers
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: 'False'
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmindata:/var/lib/pgadmin
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
  pgadmindata:
